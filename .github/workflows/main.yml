name: Build KernelSU-Next + AnyKernel3 Release

on:
  workflow_dispatch:
    inputs:
      root_provider:
        description: "Solución de root"
        type: choice
        options:
          - ksu-next-stable
          - sukisu-ultra-v4.1.3
        default: ksu-next-stable

permissions:
  contents: write

env:
  DIST_DIR: out/target/product/a05m/obj/KLEAF_OBJ/dist
  KERNEL_SRC: kernel-6.6

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------------
      # 0. Liberar espacio
      # ------------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      # ------------------------------------------------------------------
      # 2. Dependencias
      # ------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-pip \
            python-is-python3 \
            git \
            curl \
            jq \
            zip \
            unzip \
            rsync \
            device-tree-compiler \
            cpio \
            kmod \
            libncurses-dev \
            openjdk-17-jdk

# -----------------------------------------------------------------
      # PASO 1: Integrar KernelSU-Next con soporte SUSFS para kernel 6.6
      #
      # IMPORTANTE (verificado, no es una suposición):
      # El repo oficial KernelSU-Next/KernelSU-Next NO tiene SUSFS
      # funcional para kernel 6.6 (issue abierto #1293 pidiendo
      # exactamente esto, sin resolver). La única combinación que hoy
      # compila esto es un FORK personal del mantenedor "pershoot":
      #   - Driver:  https://github.com/pershoot/KernelSU-Next  (rama next-susfs,
      #     confirmada por fetch directo del setup.sh real — no un snippet de
      #     búsqueda. WildKernels menciona además una rama "dev-susfs" que
      #     podría ser más nueva; probamos next-susfs primero y caemos a
      #     dev-susfs si no existe, en vez de asumir un solo nombre)
      #   - Parches fs/: repo OFICIAL simonpunk/susfs4ksu (rama gki-android15-6.6,
      #     genérica entre forks — pershoot/susfs4ksu NO tiene rama 6.6, solo 6.1)
      #
      # ⚠️ El propio pershoot advierte que esta rama NO está lista para
      # producción, solo para pruebas/desarrollo. Si este build es para
      # un dispositivo real (no solo CI de prueba), evalúa si prefieres
      # quedarte con SukiSU-Ultra para 6.6 en su lugar.
      # -----------------------------------------------------------------
      - name: Integrar KernelSU-Next (fork pershoot, rama next-susfs - EXPERIMENTAL)
        if: ${{ inputs.root_provider == 'ksu-next-stable' }}
        working-directory: ./kernel-6.6
        run: |
          echo "⚠️  Usando el fork pershoot/KernelSU-Next — marcado por su propio mantenedor como NO apto para producción."

          KSUN_BRANCH=""
          for cand in "dev-susfs" "next-susfs"; do
            if curl -fsSL "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/${cand}/kernel/setup.sh" -o /tmp/ksun_setup.sh 2>/dev/null; then
              KSUN_BRANCH="$cand"
              break
            fi
          done
          test -n "$KSUN_BRANCH" || { echo "❌ Ninguna rama conocida (dev-susfs, next-susfs) existe en pershoot/KernelSU-Next. Revisar https://github.com/pershoot/KernelSU-Next/branches"; exit 1; }
          echo "📥 Instalando KernelSU-Next desde la rama '$KSUN_BRANCH'..."
          # NOTA: el "-s" de "curl ... | bash -s ARG" es una bandera de bash (leer
          # script desde stdin), NO un argumento del script. Como aquí lo guardamos
          # a un archivo y lo ejecutamos directo, se pasa SOLO el nombre de rama,
          # sin "-s" — pasarlo como argumento del script rompía el checkout interno
          # (esto fue justamente el bug que causó el fallo anterior).
          bash /tmp/ksun_setup.sh "$KSUN_BRANCH"

          test -d KernelSU-Next || { echo "❌ Falló la integración de KernelSU-Next (fork pershoot, rama $KSUN_BRANCH)"; exit 1; }

          echo "🔎 Confirmando que realmente quedamos en la rama $KSUN_BRANCH (no en la rama por defecto)..."
          ACTUAL_BRANCH=$(cd KernelSU-Next && git rev-parse --abbrev-ref HEAD)
          if [ "$ACTUAL_BRANCH" != "$KSUN_BRANCH" ]; then
            echo "❌ El checkout interno del setup.sh no cambió de rama: seguimos en '$ACTUAL_BRANCH', no en '$KSUN_BRANCH'."
            echo "   Forzando el checkout manualmente..."
            (cd KernelSU-Next && git fetch origin "$KSUN_BRANCH" && git checkout "$KSUN_BRANCH") || { echo "❌ No se pudo forzar el checkout a $KSUN_BRANCH"; exit 1; }
          fi
          echo "✅ En la rama correcta: $(cd KernelSU-Next && git rev-parse --abbrev-ref HEAD)"

          echo "🔎 Verificando que el driver traiga soporte SUSFS (CONFIG_KSU_SUSFS en Kconfig)..."
          grep -rq "KSU_SUSFS" KernelSU-Next/kernel/Kconfig || {
            echo "❌ KernelSU-Next/kernel/Kconfig no menciona KSU_SUSFS — la rama $KSUN_BRANCH pudo haber cambiado, revisar a mano en https://github.com/pershoot/KernelSU-Next/branches";
            exit 1;
          }
          echo "✅ Kconfig confirma soporte SUSFS integrado en el driver"

          echo "KSUN_COMMIT=$(cd KernelSU-Next && git rev-parse HEAD)" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------
      # PASO 2: Aplicar el parche 50 (fs/) al kernel.
      #
      # CORREGIDO: pershoot/susfs4ksu solo mantiene ramas para 6.1 (no
      # existe una rama 6.6 ahí — confirmado, no es un fork "universal").
      # El parche de fs/ es genérico entre forks del driver, así que
      # usamos el repo OFICIAL de simonpunk (el mismo que ya usabas desde
      # el principio) con su rama estable gki-android15-6.6. Solo el
      # DRIVER (paso anterior) necesita el fork de pershoot; el parche de
      # fs/ no.
      # -----------------------------------------------------------------
      - name: Integrar parches SUSFS al código del Kernel (Rama GKI 6.6) - KernelSU-Next
        if: ${{ inputs.root_provider == 'ksu-next-stable' }}
        working-directory: ./kernel-6.6
        run: |
          set -e
          echo "📥 Clonando repositorio oficial de SUSFS (Rama gki-android15-6.6)..."
          git clone -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

          echo "📂 Copiando archivos base de SUSFS al kernel..."
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          PATCH_DIR="../susfs4ksu/kernel_patches"

          echo "🩹 Aplicando parche 50 sobre el árbol del kernel (fs/, hooks core)..."
          PATCH_50=$(ls $PATCH_DIR/50_add_susfs_in_*.patch 2>/dev/null | head -n 1)
          test -n "$PATCH_50" || { echo "❌ No se encontró parche 50_add_susfs_in_*.patch en la rama gki-android15-6.6-dev de pershoot/susfs4ksu"; exit 1; }

          patch -p1 --forward < "$PATCH_50" || echo "⚠️ Algunos hunks del parche 50 fallaron. Iniciando inyección manual a prueba de balas..."

          # --- INICIO DE AUTO-REPARACIÓN (fs/ es genérico, no depende del fork) ---
          echo "🛠️ Inyectando dependencias base de SUSFS..."

          sed -i '1i #include <linux/sched.h>\n#include <linux/thread_info.h>\n#include <linux/cred.h>' include/linux/susfs_def.h

          for f in mm/memory.c fs/namespace.c fs/open.c fs/proc/base.c fs/exec.c; do
            if ! grep -q "linux/susfs_def.h" "$f"; then
              LAST_INCLUDE=$(grep -n "^#include" "$f" | tail -1 | cut -d: -f1)
              if [ -n "$LAST_INCLUDE" ]; then
                sed -i "${LAST_INCLUDE}a #ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif" "$f"
              else
                sed -i '1i #ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif' "$f"
              fi
            fi
          done

          if grep -q "susfs_is_current_ksu_domain\|CL_COPY_MNT_NS" fs/namespace.c; then
            echo "   [namespace.c] el parche oficial ya resolvió esto (símbolos presentes) -> NO se inyecta duplicado"
          elif ! grep -q "SUSFS_AUTOFIX_NAMESPACE" fs/namespace.c; then
            echo "   [namespace.c] inyectando externs (marcador propio no encontrado)"
            sed -i '/#include <linux\/susfs_def.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n/* SUSFS_AUTOFIX_NAMESPACE */\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n#define CL_COPY_MNT_NS BIT(25)\n#endif' fs/namespace.c
          else
            echo "   [namespace.c] ya aplicado en esta corrida -> salteado"
          fi

          if grep -q "ksu_handle_faccessat" fs/open.c; then
            echo "   [open.c] el parche oficial ya declaró estos símbolos -> NO se inyecta duplicado"
          elif ! grep -q "SUSFS_AUTOFIX_OPEN_EXTERNS" fs/open.c; then
            echo "   [open.c] inyectando externs (ksu_su_compat_enabled / __ksu_is_allow_uid_for_current / ksu_handle_faccessat)"
            sed -i '/#include <linux\/susfs_def.h>/a #ifdef CONFIG_KSU_SUSFS\n/* SUSFS_AUTOFIX_OPEN_EXTERNS */\nextern struct static_key_true ksu_su_compat_enabled;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif' fs/open.c
          else
            echo "   [open.c] externs ya aplicados en esta corrida -> salteado"
          fi

          if grep -qE '^\s*retry:' fs/open.c; then
            echo "   [open.c] ya existe un label retry: (probablemente del parche oficial) -> NO se inyecta duplicado"
          elif ! grep -q "SUSFS_AUTOFIX_RETRY_LABEL" fs/open.c; then
            echo "   [open.c] inyectando label retry: con marcador propio"
            sed -i '/fd = get_unused_fd_flags(how->flags);/a #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n/* SUSFS_AUTOFIX_RETRY_LABEL */\nretry:\n#endif' fs/open.c
          else
            echo "   [open.c] label retry ya aplicada en esta corrida -> salteado"
          fi

          if grep -q "susfs_open_redirect_spoof_do_sys_openat\|is_inode_open_redirect" fs/open.c; then
            echo "   [open.c] el parche oficial ya resolvió open_redirect (símbolos presentes) -> NO se inyecta duplicado"
          elif ! grep -q "SUSFS_AUTOFIX_OPEN_REDIRECT_BLOCK" fs/open.c; then
            echo "   [open.c] inyectando bloque de uso de open_redirect (fake_filename / is_inode_open_redirect)"
            sed -i '/struct file \*f = do_filp_open(dfd, tmp, &op);/a \
          #ifdef CONFIG_KSU_SUSFS_OPEN_REDIRECT\n\
          \t\t/* SUSFS_AUTOFIX_OPEN_REDIRECT_BLOCK */\n\
          \t\tbool is_inode_open_redirect = false;\n\
          \t\tstruct filename *fake_filename;\n\
          \t\tif (!is_inode_open_redirect && f && !IS_ERR(f)) {\n\
          \t\t\tstruct inode *inode = file_inode(f);\n\
          \t\t\tif (SUSFS_IS_INODE_OPEN_REDIRECT_WITHOUT_UID_CHECK(inode)) {\n\
          \t\t\t\tfake_filename = susfs_open_redirect_spoof_do_sys_openat(inode);\n\
          \t\t\t\tif (fake_filename && !IS_ERR(fake_filename)) {\n\
          \t\t\t\t\tis_inode_open_redirect = true;\n\
          \t\t\t\t\tfilp_close(f, NULL);\n\
          \t\t\t\t\tputname(tmp);\n\
          \t\t\t\t\ttmp = fake_filename;\n\
          \t\t\t\t\tgoto retry;\n\
          \t\t\t\t}\n\
          \t\t\t}\n\
          \t\t}\n\
          #endif' fs/open.c
          else
            echo "   [open.c] bloque open_redirect ya aplicado en esta corrida -> salteado"
          fi

          if grep -q "ksu_handle_execveat" fs/exec.c; then
            echo "   [exec.c] el parche oficial ya declaró estos símbolos -> NO se inyecta duplicado"
          elif ! grep -q "SUSFS_AUTOFIX_EXEC" fs/exec.c; then
            echo "   [exec.c] inyectando externs"
            sed -i '/#include <linux\/susfs_def.h>/a #ifdef CONFIG_KSU_SUSFS\n/* SUSFS_AUTOFIX_EXEC */\nextern struct static_key_true ksu_su_compat_enabled;\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\nextern bool __ksu_is_allow_uid_for_current(uid_t uid);\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\nextern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif' fs/exec.c
          else
            echo "   [exec.c] ya aplicado en esta corrida -> salteado"
          fi

          echo "🔎 Verificando que fs/ quedó en un estado consistente (marcador propio O símbolo del parche oficial)..."
          for check in "fs/namespace.c:SUSFS_AUTOFIX_NAMESPACE:susfs_is_current_ksu_domain" "fs/open.c:SUSFS_AUTOFIX_OPEN_EXTERNS:ksu_handle_faccessat" "fs/open.c:SUSFS_AUTOFIX_RETRY_LABEL:retry:" "fs/open.c:SUSFS_AUTOFIX_OPEN_REDIRECT_BLOCK:susfs_open_redirect_spoof_do_sys_openat" "fs/exec.c:SUSFS_AUTOFIX_EXEC:ksu_handle_execveat"; do
            file="$(echo "$check" | cut -d: -f1)"
            marker="$(echo "$check" | cut -d: -f2)"
            symbol="$(echo "$check" | cut -d: -f3)"
            if grep -q "$marker" "$file" 2>/dev/null; then
              echo "   ✅ $marker presente en $file (inyectado por auto-reparación)"
            elif grep -qF "$symbol" "$file" 2>/dev/null; then
              echo "   ✅ $symbol presente en $file (ya resuelto por el parche oficial, sin duplicar)"
            else
              echo "   ❌ Ni $marker ni $symbol están en $file — algo quedó a medias, revisar a mano"
              exit 1
            fi
          done
          echo "✅ Auto-reparación de fs/ completada con éxito (sin duplicados)."
          # --- FIN DE AUTO-REPARACIÓN ---

          if ls $PATCH_DIR/51_susfs_add_hook_in_*.patch 1> /dev/null 2>&1; then
            patch -p1 --forward < $(ls $PATCH_DIR/51_susfs_add_hook_in_*.patch | head -n 1) || {
              echo "❌ Falló el parche 51 — revisar *.rej:"
              find . -name '*.rej' -exec echo "--- {} ---" \; -exec cat {} \;
              exit 1
            }
          else
            echo "ℹ️ Parche 51 no encontrado, los hooks probablemente estén unificados en el parche 50."
          fi

          grep -q "susfs" fs/Makefile || { echo "❌ El parche 50 no modificó fs/Makefile como se esperaba, abortando en vez de inyectar a mano"; exit 1; }

          echo "🔎 Verificación final: el driver de pershoot (rama next-susfs/dev-susfs) ya trae susfs_init() de fábrica"
          if [ -f drivers/kernelsu/core/init.c ]; then
            grep -q "susfs_init()" drivers/kernelsu/core/init.c && echo "✅ susfs_init() presente en drivers/kernelsu/core/init.c" \
              || echo "⚠️ No se encontró susfs_init() en drivers/kernelsu/core/init.c — revisar si el symlink apunta a KernelSU-Next/ correctamente"
          elif [ -f KernelSU-Next/kernel/core/init.c ]; then
            grep -q "susfs_init()" KernelSU-Next/kernel/core/init.c && echo "✅ susfs_init() presente en KernelSU-Next/kernel/core/init.c (integrado de fábrica en esta rama)" \
              || echo "⚠️ No se encontró susfs_init() en el init.c del driver — inesperado, revisar a mano"
          fi
          
      # ------------------------------------------------------------------
      # 5. Compilar
      # ------------------------------------------------------------------
      - name: Build kernel
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      # ------------------------------------------------------------------
      # 6. Buscar Image
      # ------------------------------------------------------------------
      - name: Locate compiled Image
        run: |
          echo "===== DIST_DIR ====="

          FOUND=""

          if [ -d "$DIST_DIR" ]; then
            FOUND=$(find "$DIST_DIR" -type f \( -name "Image" -o -name "Image.gz" \) | head -n1)
          else
            echo "DIST_DIR no existe, probando ruta alterna..."
          fi

          if [ -z "$FOUND" ]; then
            FOUND=$(find out/target/product/a05m/obj/KLEAF_OBJ \
              -type f \( -name "Image" -o -name "Image.gz" \) 2>/dev/null | head -n1)
          fi

          if [ -z "$FOUND" ]; then
            echo "No se encontró Image"
            exit 1
          fi

          echo "Kernel image: $FOUND"

          cp "$FOUND" ./Image

      # ------------------------------------------------------------------
      # 7. Empaquetar AnyKernel3
      # ------------------------------------------------------------------
      - name: Package AnyKernel3
        run: |
          cp ./Image AnyKernel3/Image

          ZIP_NAME="AnyKernel3-KSU-${KSU_VERSION}-$(date +%Y%m%d).zip"

          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" . -x ".git*"
          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 8. Crear Release
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KSU_VERSION }}
          name: "A05M Kernel - KernelSU-Next ${{ env.KSU_VERSION }}"
          body: |
            Build automático.

            - KernelSU-Next: ${{ env.KSU_VERSION }}
            - Commit: ${{ github.sha }}
            - Run ID: ${{ github.run_id }}

          files: |
            ${{ env.ZIP_NAME }}
            Image
