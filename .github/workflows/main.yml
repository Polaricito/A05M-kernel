name: Build KernelSU-Next + AnyKernel3 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build_ksu-release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  DIST_DIR: out/target/product/a05m/obj/KLEAF_OBJ/dist
  KERNEL_SRC: kernel-6.6

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------------
      # 0. Liberar espacio
      # ------------------------------------------------------------------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      # ------------------------------------------------------------------
      # 2. Dependencias
      # ------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-pip \
            python-is-python3 \
            git \
            curl \
            jq \
            zip \
            unzip \
            rsync \
            device-tree-compiler \
            cpio \
            kmod \
            libncurses-dev \
            openjdk-17-jdk

      # ------------------------------------------------------------------
      # 3. Obtener la última release de KernelSU-Next
      # ------------------------------------------------------------------
      - name: Get latest KernelSU-Next release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KSU_VERSION=$(curl -sSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$KSU_VERSION" ] || [ "$KSU_VERSION" = "null" ]; then
            echo "No se pudo obtener KSU_VERSION (revisa rate limit de la API de GitHub)"
            exit 1
          fi

          echo "KernelSU Version: $KSU_VERSION"
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 4. Integrar KernelSU-Next
      # ------------------------------------------------------------------
      - name: Integrate KernelSU-Next
        working-directory: ${{ env.KERNEL_SRC }}
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s "${KSU_VERSION}"

      # ------------------------------------------------------------------
      # 5. Compilar
      # ------------------------------------------------------------------
      - name: Build kernel
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh

      # ------------------------------------------------------------------
      # 6. Buscar Image
      # ------------------------------------------------------------------
      - name: Locate compiled Image
        run: |
          echo "===== DIST_DIR ====="

          FOUND=""

          if [ -d "$DIST_DIR" ]; then
            FOUND=$(find "$DIST_DIR" -type f \( -name "Image" -o -name "Image.gz" \) | head -n1)
          else
            echo "DIST_DIR no existe, probando ruta alterna..."
          fi

          if [ -z "$FOUND" ]; then
            FOUND=$(find out/target/product/a05m/obj/KLEAF_OBJ \
              -type f \( -name "Image" -o -name "Image.gz" \) 2>/dev/null | head -n1)
          fi

          if [ -z "$FOUND" ]; then
            echo "No se encontró Image"
            exit 1
          fi

          echo "Kernel image: $FOUND"

          cp "$FOUND" ./Image

      # ------------------------------------------------------------------
      # 7. Empaquetar AnyKernel3
      # ------------------------------------------------------------------
      - name: Package AnyKernel3
        run: |
          cp ./Image AnyKernel3/Image

          ZIP_NAME="AnyKernel3-KSU-${KSU_VERSION}-$(date +%Y%m%d).zip"

          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" . -x ".git*"
          cd ..

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 8. Crear Release
      # ------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KSU_VERSION }}
          name: "A05M Kernel - KernelSU-Next ${{ env.KSU_VERSION }}"
          body: |
            Build automático.

            - KernelSU-Next: ${{ env.KSU_VERSION }}
            - Commit: ${{ github.sha }}
            - Run ID: ${{ github.run_id }}

          files: |
            ${{ env.ZIP_NAME }}
            Image
